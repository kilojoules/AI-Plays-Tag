# Pixi environment for AI Tag Game (open-source only)

[workspace]
name = "ai-tag-game"
channels = ["conda-forge", "pytorch"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[feature.server.dependencies]
python = "3.11.*"
numpy = ">=1.24,<2.0"
matplotlib = "*"
ffmpeg = "*"

[feature.rl.dependencies]
pytorch = ">=2.2"
gymnasium = "*"
scipy = ">=1.11"
statsmodels = ">=0.14"

[environments]
default = { features = ["server"] }
train = { features = ["server", "rl"] }

[tasks]
plot = "python trainer/plot_metrics.py"
collect-debug = "bash scripts/collect_debug_artifacts.sh"
plot-paths = "python scripts/plot_paths_from_trajectory.py"
monitor = "python trainer/monitor_runs.py"
monitor-all = "python trainer/monitor_runs.py --all-runs"

# Training
train = "python trainer/train_fast.py"
train-quick = "python trainer/train_fast.py --timesteps 100000"
train-full = "python trainer/train_fast.py --timesteps 1000000"

# Training with obstacles
train-obstacles = "python trainer/train_fast.py --layout four_corners"
train-obstacles-quick = "python trainer/train_fast.py --layout four_corners --timesteps 100000"
train-obstacles-full = "python trainer/train_fast.py --layout four_corners --timesteps 1000000"

# Visualization
visualize = "python trainer/visualize_outcome.py"
visualize-anim = "python trainer/visualize_outcome.py --animate"
visualize-obstacles = "python trainer/visualize_outcome.py --layout four_corners"
visualize-obstacles-anim = "python trainer/visualize_outcome.py --layout four_corners --animate"

# Experiments: Self-play vs SCRO comparison
exp-scro = "python experiments/train_scro.py"
exp-compare = "python experiments/run_comparison.py"
exp-visualize = "python experiments/visualize_comparison.py"
exp-crossplay = "python experiments/cross_evaluate.py"

# A-parameter research loop
research-phase0 = "bash run_research_loop.sh 0"
research-phase1 = "bash run_research_loop.sh 1"
research-phase2 = "bash run_research_loop.sh 2"
research-phase3 = "bash run_research_loop.sh 3"
research-crosseval = "bash run_research_loop.sh 4"
analyze-sweep = "python experiments/analyze_a_sweep.py experiments/results/sweep"

[dependencies]
pytorch = ">=2.10.0,<3"
pandas = ">=3.0.0,<4"
ffmpeg = ">=8.0.0,<9"
pettingzoo = ">=1.25.0,<2"
pygame = ">=2.6.1,<3"
mujoco = ">=3.6.0,<4"
